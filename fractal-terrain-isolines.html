<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Terrain Isoline Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #1a1a1a;
            color: #fff;
        }
        #canvas {
            display: block;
            cursor: crosshair;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            max-width: 300px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #aaa;
        }
        input[type="range"] {
            width: 100%;
        }
        input[type="number"] {
            width: 100%;
            padding: 5px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
        }
        select {
            width: 100%;
            padding: 5px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 5px;
        }
        button:hover {
            background: #45a049;
        }
        .value-display {
            display: inline-block;
            color: #4CAF50;
            font-weight: bold;
            margin-left: 10px;
        }
        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            display: none;
            z-index: 1000;
            border: 1px solid #4CAF50;
        }
        h3 {
            margin-bottom: 15px;
            font-size: 16px;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="controls">
        <h3>Fractal Terrain Isolines</h3>

        <div class="control-group">
            <label>Point Distribution:</label>
            <select id="distributionType">
                <option value="poisson">Poisson Disc Sampling</option>
                <option value="hex">Hexagonal Grid</option>
            </select>
        </div>

        <div class="control-group">
            <label>Number of Points: <span class="value-display" id="pointsValue">500</span></label>
            <input type="range" id="numPoints" min="100" max="2000" value="500" step="50">
        </div>

        <div class="control-group">
            <label>Terrain Roughness: <span class="value-display" id="roughnessValue">0.7</span></label>
            <input type="range" id="roughness" min="0.1" max="1.5" value="0.7" step="0.1">
        </div>

        <div class="control-group">
            <label>Terrain Scale: <span class="value-display" id="scaleValue">200</span></label>
            <input type="range" id="terrainScale" min="50" max="500" value="200" step="10">
        </div>

        <div class="control-group">
            <label>Octaves: <span class="value-display" id="octavesValue">4</span></label>
            <input type="range" id="octaves" min="1" max="8" value="4" step="1">
        </div>

        <div class="control-group">
            <label>Seed:</label>
            <input type="number" id="seed" value="12345">
        </div>

        <div class="control-group">
            <label style="color: #888; font-style: italic;">Isolines at: 1.5, 2.5, 3.5, 4.5, 5.5, 6.5, 7.5, 8.5, 9.5</label>
        </div>

        <button id="generateBtn">Generate Terrain</button>

        <div class="control-group" style="margin-top: 20px;">
            <h3 style="margin-bottom: 10px;">Display Options</h3>
            <button id="togglePoints" style="background: #2196F3;">Toggle Points</button>
            <button id="toggleEdges" style="background: #2196F3;">Toggle Edges</button>
            <button id="toggleIsolines" style="background: #2196F3;">Toggle Isolines</button>
        </div>

        <div class="control-group" style="margin-top: 20px;">
            <h3 style="margin-bottom: 10px;">Pathfinding</h3>
            <button id="togglePathfinding" style="background: #FF9800;">Enable Pathfinding</button>
            <button id="clearPath" style="background: #f44336;">Clear Path</button>
            <p style="font-size: 11px; color: #888; margin-top: 10px;">
                Enable pathfinding, then click two nodes to find the optimal path considering elevation changes.
            </p>
        </div>
    </div>

    <div id="tooltip"></div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('tooltip');

        let width, height;
        let points = [];
        let edges = [];
        let triangles = [];
        let isolines = [];
        let terrain = null;
        let showPoints = true;
        let showEdges = true;
        let showIsolines = true;
        let selectedNode = null;
        let medianEdgeLength = 0;

        // Pathfinding state
        let pathfindingMode = false;
        let startNode = null;
        let endNode = null;
        let currentPath = null;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Seeded random number generator
        class Random {
            constructor(seed) {
                this.seed = seed;
            }
            next() {
                this.seed = (this.seed * 9301 + 49297) % 233280;
                return this.seed / 233280;
            }
        }

        // Poisson Disc Sampling
        function poissonDiscSampling(width, height, numPoints) {
            const radius = Math.sqrt((width * height) / numPoints) * 0.8;
            const k = 30;
            const cellSize = radius / Math.sqrt(2);
            const gridWidth = Math.ceil(width / cellSize);
            const gridHeight = Math.ceil(height / cellSize);
            const grid = new Array(gridWidth * gridHeight);
            const active = [];
            const points = [];

            function randomPoint() {
                return {
                    x: Math.random() * width,
                    y: Math.random() * height
                };
            }

            function gridIndex(x, y) {
                const i = Math.floor(x / cellSize);
                const j = Math.floor(y / cellSize);
                return i + j * gridWidth;
            }

            function tooClose(x, y) {
                const i = Math.floor(x / cellSize);
                const j = Math.floor(y / cellSize);

                for (let di = -2; di <= 2; di++) {
                    for (let dj = -2; dj <= 2; dj++) {
                        const ni = i + di;
                        const nj = j + dj;
                        if (ni >= 0 && ni < gridWidth && nj >= 0 && nj < gridHeight) {
                            const idx = ni + nj * gridWidth;
                            const neighbor = grid[idx];
                            if (neighbor) {
                                const dx = neighbor.x - x;
                                const dy = neighbor.y - y;
                                if (dx * dx + dy * dy < radius * radius) {
                                    return true;
                                }
                            }
                        }
                    }
                }
                return false;
            }

            const first = randomPoint();
            active.push(first);
            points.push(first);
            grid[gridIndex(first.x, first.y)] = first;

            while (active.length > 0 && points.length < numPoints) {
                const idx = Math.floor(Math.random() * active.length);
                const point = active[idx];
                let found = false;

                for (let i = 0; i < k; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const r = radius + Math.random() * radius;
                    const x = point.x + r * Math.cos(angle);
                    const y = point.y + r * Math.sin(angle);

                    if (x >= 0 && x < width && y >= 0 && y < height && !tooClose(x, y)) {
                        const newPoint = { x, y };
                        active.push(newPoint);
                        points.push(newPoint);
                        grid[gridIndex(x, y)] = newPoint;
                        found = true;
                        break;
                    }
                }

                if (!found) {
                    active.splice(idx, 1);
                }
            }

            return points;
        }

        // Hexagonal grid generation
        function hexagonalGrid(width, height, numPoints) {
            const points = [];
            const area = width * height;
            const hexArea = area / numPoints;
            const radius = Math.sqrt(hexArea / (3 * Math.sqrt(3) / 2));

            const dx = radius * 3 / 2;
            const dy = radius * Math.sqrt(3);

            let offsetY = 0;
            for (let y = 0; y < height + dy; y += dy) {
                let offsetX = (offsetY % 2) * dx / 2;
                for (let x = 0; x < width + dx; x += dx) {
                    const px = x + offsetX;
                    const py = y;
                    if (px >= 0 && px < width && py >= 0 && py < height) {
                        points.push({ x: px, y: py });
                    }
                }
                offsetY++;
            }

            return points;
        }

        // Fractal terrain generation using multi-octave Perlin-like noise
        class TerrainGenerator {
            constructor(width, height, seed) {
                this.width = width;
                this.height = height;
                this.random = new Random(seed);
                this.permutation = this.generatePermutation();
            }

            generatePermutation() {
                const p = [];
                for (let i = 0; i < 256; i++) p[i] = i;

                // Fisher-Yates shuffle with seeded random
                for (let i = 255; i > 0; i--) {
                    const j = Math.floor(this.random.next() * (i + 1));
                    [p[i], p[j]] = [p[j], p[i]];
                }

                return [...p, ...p];
            }

            fade(t) {
                return t * t * t * (t * (t * 6 - 15) + 10);
            }

            lerp(t, a, b) {
                return a + t * (b - a);
            }

            grad(hash, x, y) {
                const h = hash & 15;
                const u = h < 8 ? x : y;
                const v = h < 4 ? y : x;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }

            noise(x, y) {
                const X = Math.floor(x) & 255;
                const Y = Math.floor(y) & 255;

                x -= Math.floor(x);
                y -= Math.floor(y);

                const u = this.fade(x);
                const v = this.fade(y);

                const p = this.permutation;
                const a = p[X] + Y;
                const b = p[X + 1] + Y;

                return this.lerp(v,
                    this.lerp(u, this.grad(p[a], x, y), this.grad(p[b], x - 1, y)),
                    this.lerp(u, this.grad(p[a + 1], x, y - 1), this.grad(p[b + 1], x - 1, y - 1))
                );
            }

            generate(scale, octaves, roughness) {
                const terrain = [];
                let min = Infinity;
                let max = -Infinity;

                for (let y = 0; y < this.height; y++) {
                    terrain[y] = [];
                    for (let x = 0; x < this.width; x++) {
                        let value = 0;
                        let amplitude = 1;
                        let frequency = 1;
                        let maxValue = 0;

                        for (let i = 0; i < octaves; i++) {
                            const sampleX = (x / scale) * frequency;
                            const sampleY = (y / scale) * frequency;
                            value += this.noise(sampleX, sampleY) * amplitude;
                            maxValue += amplitude;
                            amplitude *= roughness;
                            frequency *= 2;
                        }

                        value /= maxValue;
                        terrain[y][x] = value;
                        min = Math.min(min, value);
                        max = Math.max(max, value);
                    }
                }

                // Normalize to 0-100
                for (let y = 0; y < this.height; y++) {
                    for (let x = 0; x < this.width; x++) {
                        terrain[y][x] = ((terrain[y][x] - min) / (max - min)) * 100;
                    }
                }

                return terrain;
            }
        }

        // Get elevation from terrain
        function getElevation(x, y) {
            if (!terrain) return 0;
            const tx = Math.floor(x);
            const ty = Math.floor(y);
            if (tx < 0 || tx >= width || ty < 0 || ty >= height) return 0;
            return terrain[ty][tx];
        }

        // Delaunay triangulation (Bowyer-Watson algorithm)
        class Delaunay {
            constructor(points) {
                this.points = points;
                this.triangles = [];
                this.edges = [];
                this.triangulate();
                this.extractEdges();
            }

            triangulate() {
                console.log('  Delaunay.triangulate() starting with', this.points.length, 'points');
                if (this.points.length < 3) {
                    console.error('  ERROR: Not enough points for triangulation:', this.points.length);
                    return;
                }

                // Create super triangle
                const maxX = Math.max(...this.points.map(p => p.x));
                const maxY = Math.max(...this.points.map(p => p.y));
                const minX = Math.min(...this.points.map(p => p.x));
                const minY = Math.min(...this.points.map(p => p.y));

                const dx = maxX - minX;
                const dy = maxY - minY;
                const deltaMax = Math.max(dx, dy);
                const midx = (minX + maxX) / 2;
                const midy = (minY + maxY) / 2;

                const p1 = { x: midx - 20 * deltaMax, y: midy - deltaMax };
                const p2 = { x: midx, y: midy + 20 * deltaMax };
                const p3 = { x: midx + 20 * deltaMax, y: midy - deltaMax };

                console.log('  Super triangle vertices:', { p1, p2, p3 });
                // Push in counter-clockwise order [p1, p3, p2] instead of [p1, p2, p3]
                this.triangles.push([p1, p3, p2]);

                // Add points one at a time
                let pointsProcessed = 0;
                for (const point of this.points) {
                    const badTriangles = [];

                    for (const triangle of this.triangles) {
                        if (this.inCircumcircle(point, triangle)) {
                            badTriangles.push(triangle);
                        }
                    }

                    pointsProcessed++;
                    if (pointsProcessed <= 3 || pointsProcessed % 100 === 0) {
                        console.log(`  Processing point ${pointsProcessed}/${this.points.length}: found ${badTriangles.length} bad triangles, currently have ${this.triangles.length} triangles`);
                    }

                    const polygon = [];
                    for (const triangle of badTriangles) {
                        for (let i = 0; i < 3; i++) {
                            const edge = [triangle[i], triangle[(i + 1) % 3]];
                            let isShared = false;

                            for (const other of badTriangles) {
                                if (other === triangle) continue;
                                if (this.hasEdge(other, edge)) {
                                    isShared = true;
                                    break;
                                }
                            }

                            if (!isShared) {
                                polygon.push(edge);
                            }
                        }
                    }

                    this.triangles = this.triangles.filter(t => !badTriangles.includes(t));

                    for (const edge of polygon) {
                        this.triangles.push([edge[0], edge[1], point]);
                    }
                }

                // Remove triangles that share vertices with super triangle
                const trianglesBeforeFilter = this.triangles.length;
                console.log('  Triangles before super triangle removal:', trianglesBeforeFilter);

                this.triangles = this.triangles.filter(triangle => {
                    const hasSuperVertex = triangle.some(p => p === p1 || p === p2 || p === p3);
                    return !hasSuperVertex;
                });

                console.log('  Triangles after super triangle removal:', this.triangles.length);
                console.log('  Removed', trianglesBeforeFilter - this.triangles.length, 'triangles');
                console.log('  Delaunay.triangulate() finished with', this.triangles.length, 'triangles');
            }

            inCircumcircle(point, triangle) {
                const [a, b, c] = triangle;
                const ax = a.x - point.x;
                const ay = a.y - point.y;
                const bx = b.x - point.x;
                const by = b.y - point.y;
                const cx = c.x - point.x;
                const cy = c.y - point.y;

                const det = (ax * ax + ay * ay) * (bx * cy - cx * by) -
                           (bx * bx + by * by) * (ax * cy - cx * ay) +
                           (cx * cx + cy * cy) * (ax * by - bx * ay);

                // Log first few circumcircle tests
                if (!this._circumcircleTestCount) this._circumcircleTestCount = 0;
                this._circumcircleTestCount++;
                if (this._circumcircleTestCount <= 5) {
                    console.log(`    inCircumcircle test #${this._circumcircleTestCount}: det=${det.toFixed(2)}, result=${det > 0}`);
                    console.log(`      point=(${point.x.toFixed(1)}, ${point.y.toFixed(1)})`);
                    console.log(`      triangle: a=(${a.x.toFixed(1)}, ${a.y.toFixed(1)}), b=(${b.x.toFixed(1)}, ${b.y.toFixed(1)}), c=(${c.x.toFixed(1)}, ${c.y.toFixed(1)})`);
                }

                return det > 0;
            }

            hasEdge(triangle, edge) {
                for (let i = 0; i < 3; i++) {
                    const e = [triangle[i], triangle[(i + 1) % 3]];
                    if ((e[0] === edge[0] && e[1] === edge[1]) ||
                        (e[0] === edge[1] && e[1] === edge[0])) {
                        return true;
                    }
                }
                return false;
            }

            extractEdges() {
                console.log('  Delaunay.extractEdges() starting with', this.triangles.length, 'triangles');
                const edgeSet = new Set();

                for (const triangle of this.triangles) {
                    for (let i = 0; i < 3; i++) {
                        const p1 = triangle[i];
                        const p2 = triangle[(i + 1) % 3];

                        const key = p1.x < p2.x || (p1.x === p2.x && p1.y < p2.y) ?
                            `${p1.x},${p1.y}-${p2.x},${p2.y}` :
                            `${p2.x},${p2.y}-${p1.x},${p1.y}`;

                        if (!edgeSet.has(key)) {
                            edgeSet.add(key);
                            const dx = p2.x - p1.x;
                            const dy = p2.y - p1.y;
                            const length = Math.sqrt(dx * dx + dy * dy);
                            this.edges.push({ p1, p2, length });
                        }
                    }
                }

                console.log('  Delaunay.extractEdges() finished with', this.edges.length, 'edges');
            }

            trimLongEdges() {
                console.log('  Delaunay.trimLongEdges() starting with', this.edges.length, 'edges');

                // Calculate median edge length
                const lengths = this.edges.map(e => e.length).sort((a, b) => a - b);
                const medianLength = lengths[Math.floor(lengths.length / 2)];
                console.log('  Median edge length:', medianLength.toFixed(2));

                // Keep only edges <= 1.5x median
                const threshold = medianLength * 1.5;
                const originalCount = this.edges.length;
                this.edges = this.edges.filter(e => e.length <= threshold);

                console.log('  Trimmed', originalCount - this.edges.length, 'edges');
                console.log('  Remaining edges:', this.edges.length);

                return medianLength;
            }
        }

        // Triangle-based isoline generation with middle-third constraint and curve support
        function generateIsolines(triangles, points) {
            console.log('  generateIsolines() starting with', triangles.length, 'triangles');

            // Isoline levels are at X.5 (1.5, 2.5, 3.5, ..., 9.5)
            const isolineLevels = [1.5, 2.5, 3.5, 4.5, 5.5, 6.5, 7.5, 8.5, 9.5];

            // First pass: collect all edge crossings grouped by edge
            const edgeCrossings = new Map(); // key: edge string, value: array of {level, t, triangle}

            // Helper to create edge key and canonical ordering based on elevation
            // Always order from lower elevation to higher elevation for consistency
            function getCanonicalEdge(p1, p2) {
                const e1 = p1.normalizedElevation;
                const e2 = p2.normalizedElevation;

                // Order by elevation first, then by position if elevations are equal
                if (e1 < e2 || (e1 === e2 && (p1.x < p2.x || (p1.x === p2.x && p1.y < p2.y)))) {
                    return {
                        key: `${p1.x},${p1.y}-${p2.x},${p2.y}`,
                        p1: p1,
                        p2: p2,
                        e1: e1,
                        e2: e2
                    };
                } else {
                    return {
                        key: `${p2.x},${p2.y}-${p1.x},${p1.y}`,
                        p1: p2,
                        p2: p1,
                        e1: e2,
                        e2: e1
                    };
                }
            }

            // Process each triangle
            for (const triangle of triangles) {
                const [p0, p1, p2] = triangle;

                const edges = [
                    { p1: p0, p2: p1 },
                    { p1: p1, p2: p2 },
                    { p1: p2, p2: p0 }
                ];

                for (const edge of edges) {
                    const canonical = getCanonicalEdge(edge.p1, edge.p2);

                    for (const level of isolineLevels) {
                        // Check if this level crosses the edge
                        if ((canonical.e1 < level && canonical.e2 > level) ||
                            (canonical.e1 > level && canonical.e2 < level)) {

                            // Calculate t in the canonical direction (low elevation to high elevation)
                            const t = (level - canonical.e1) / (canonical.e2 - canonical.e1);

                            if (!edgeCrossings.has(canonical.key)) {
                                edgeCrossings.set(canonical.key, {
                                    p1: canonical.p1,
                                    p2: canonical.p2,
                                    e1: canonical.e1,
                                    e2: canonical.e2,
                                    crossings: []
                                });
                            }

                            edgeCrossings.get(canonical.key).crossings.push({ level, t, triangle });
                        }
                    }
                }
            }

            // Second pass: Find max crossings and calculate fixed spacing
            let maxCrossings = 0;
            for (const [edgeKey, edgeData] of edgeCrossings.entries()) {
                maxCrossings = Math.max(maxCrossings, edgeData.crossings.length);
            }

            // Calculate fixed spacing based on max crossings
            // The edge with most crossings should fit all within middle third
            const middleThirdSize = 1/3;
            const fixedSpacing = maxCrossings > 1 ? middleThirdSize / (maxCrossings - 1) : 0;
            console.log('  Max crossings on any edge:', maxCrossings);
            console.log('  Fixed spacing between crossings:', fixedSpacing.toFixed(4));

            // Redistribute crossings centered on middle of each edge with fixed spacing
            const redistributedEdges = new Map();

            for (const [edgeKey, edgeData] of edgeCrossings.entries()) {
                const { p1, p2, e1, e2, crossings } = edgeData;

                // Sort crossings by level (which corresponds to position along canonical edge)
                crossings.sort((a, b) => a.level - b.level);

                const numCrossings = crossings.length;
                if (numCrossings === 0) continue;

                // Center crossings on middle of edge (t=0.5) with fixed spacing
                const redistributed = crossings.map((crossing, index) => {
                    let newT;
                    if (numCrossings === 1) {
                        // Single crossing: place at center
                        newT = 0.5;
                    } else {
                        // Multiple crossings: center them around 0.5 with fixed spacing
                        const totalSpan = (numCrossings - 1) * fixedSpacing;
                        const startT = 0.5 - totalSpan / 2;
                        newT = startT + index * fixedSpacing;
                    }

                    return {
                        level: crossing.level,
                        t: newT,
                        originalT: crossing.t
                    };
                });

                redistributedEdges.set(edgeKey, {
                    p1, p2, e1, e2, crossings: redistributed
                });
            }

            // Third pass: create isoline segments by matching crossings across triangles
            const lines = [];
            const processedSegments = new Set();
            let missingLineCount = 0;
            let trianglesWithMissingLines = 0;

            for (const triangle of triangles) {
                const [p0, p1, p2] = triangle;

                const edges = [
                    { p1: p0, p2: p1 },
                    { p1: p1, p2: p2 },
                    { p1: p2, p2: p0 }
                ];

                for (const level of isolineLevels) {
                    const crossings = [];

                    for (const edge of edges) {
                        const canonical = getCanonicalEdge(edge.p1, edge.p2);
                        const edgeData = redistributedEdges.get(canonical.key);

                        if (edgeData) {
                            const crossing = edgeData.crossings.find(c => c.level === level);
                            if (crossing) {
                                // Calculate actual position using redistributed t
                                // t is always in the canonical direction (low elevation to high elevation)
                                const x = edgeData.p1.x + crossing.t * (edgeData.p2.x - edgeData.p1.x);
                                const y = edgeData.p1.y + crossing.t * (edgeData.p2.y - edgeData.p1.y);

                                crossings.push({
                                    x, y,
                                    edgeP1: edgeData.p1,
                                    edgeP2: edgeData.p2,
                                    t: crossing.t,
                                    edgeKey: canonical.key
                                });
                            }
                        }
                    }

                    // Check for missing lines (triangles with odd number of crossings)
                    if (crossings.length !== 0 && crossings.length !== 2) {
                        missingLineCount++;
                        if (crossings.length === 1 || crossings.length === 3) {
                            trianglesWithMissingLines++;
                            console.warn(`  Triangle has ${crossings.length} crossing(s) at level ${level} - possible missing line`);
                        }
                    }

                    // If we have exactly 2 crossings, create an isoline segment
                    if (crossings.length === 2) {
                        const segmentKey = `${level}:${Math.min(crossings[0].x, crossings[1].x)},${Math.min(crossings[0].y, crossings[1].y)}`;

                        if (!processedSegments.has(segmentKey)) {
                            processedSegments.add(segmentKey);

                            // Calculate curve control points for each endpoint
                            const segments = [];
                            for (let i = 0; i < 2; i++) {
                                const crossing = crossings[i];

                                // Calculate perpendicular direction to edge
                                const edgeDx = crossing.edgeP2.x - crossing.edgeP1.x;
                                const edgeDy = crossing.edgeP2.y - crossing.edgeP1.y;
                                const edgeLength = Math.sqrt(edgeDx * edgeDx + edgeDy * edgeDy);

                                // Perpendicular vector (rotated 90 degrees)
                                const perpX = -edgeDy / edgeLength;
                                const perpY = edgeDx / edgeLength;

                                segments.push({
                                    x: crossing.x,
                                    y: crossing.y,
                                    perpX,
                                    perpY,
                                    edgeKey: crossing.edgeKey,
                                    t: crossing.t
                                });
                            }

                            lines.push({
                                p1: { x: segments[0].x, y: segments[0].y },
                                p2: { x: segments[1].x, y: segments[1].y },
                                perp1: { x: segments[0].perpX, y: segments[0].perpY },
                                perp2: { x: segments[1].perpX, y: segments[1].perpY },
                                level: level,
                                t1: segments[0].t,
                                t2: segments[1].t
                            });
                        }
                    }
                }
            }

            if (trianglesWithMissingLines > 0) {
                console.warn(`  Found ${trianglesWithMissingLines} triangles with potential missing lines (total ${missingLineCount} anomalies)`);
            }

            console.log('  generateIsolines() finished with', lines.length, 'isoline segments');

            // Count isolines per level
            const countsPerLevel = {};
            for (const line of lines) {
                countsPerLevel[line.level] = (countsPerLevel[line.level] || 0) + 1;
            }
            console.log('  Isolines per level:', countsPerLevel);

            return lines;
        }

        // Drawing functions
        function drawPoints() {
            console.log('  drawPoints() called - drawing', points.length, 'points');
            ctx.fillStyle = '#fff';
            let drawn = 0;
            for (const point of points) {
                const color = getElevationColor(point.normalizedElevation);
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(point.x, point.y, 3, 0, Math.PI * 2);
                ctx.fill();
                drawn++;
            }
            console.log('  drawPoints() finished - drew', drawn, 'points');
        }

        function drawEdges() {
            console.log('  drawEdges() called - drawing', edges.length, 'edges');
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 0.5;
            let drawn = 0;
            for (const edge of edges) {
                ctx.beginPath();
                ctx.moveTo(edge.p1.x, edge.p1.y);
                ctx.lineTo(edge.p2.x, edge.p2.y);
                ctx.stroke();
                drawn++;
            }
            console.log('  drawEdges() finished - drew', drawn, 'edges');
        }

        function drawIsolines() {
            console.log('  drawIsolines() called - drawing', isolines.length, 'isoline segments');
            let drawn = 0;

            for (const line of isolines) {
                const color = getElevationColor(line.level);
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;

                // Calculate vector between endpoints
                const dx = line.p2.x - line.p1.x;
                const dy = line.p2.y - line.p1.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                // Calculate perpendicular to the isoline segment (not the edges)
                // Rotate 90 degrees counter-clockwise
                const perpX = -dy / distance;
                const perpY = dx / distance;

                // Determine bulge direction by checking which way points "outward"
                // Use the average of edge perpendiculars to determine the preferred direction
                const avgEdgePerpX = (line.perp1.x + line.perp2.x) / 2;
                const avgEdgePerpY = (line.perp1.y + line.perp2.y) / 2;

                // Dot product to determine if we should flip the perpendicular
                const dot = perpX * avgEdgePerpX + perpY * avgEdgePerpY;
                const sign = dot >= 0 ? 1 : -1;

                // Calculate bulge amount based on position within middle third
                // Isolines at t=0.5 (center) get maximum bulge
                // Isolines at t=1/3 or t=2/3 (edges of middle third) get minimum bulge
                const tAvg = (line.t1 + line.t2) / 2;
                const tNormalized = (tAvg - 1/3) / (1/3); // Maps [1/3, 2/3] to [0, 1]
                // Parabolic curve: maximum at center (0.5), minimum at edges
                const tFactor = 1 - 4 * Math.pow(tNormalized - 0.5, 2); // Peak at 0.5

                const baseBulge = distance * 0.2; // 20% of segment length
                const bulge = baseBulge * Math.max(0.3, tFactor); // Minimum 30% bulge

                // Calculate control point at midpoint, offset perpendicular
                const midX = (line.p1.x + line.p2.x) / 2;
                const midY = (line.p1.y + line.p2.y) / 2;
                const controlX = midX + sign * perpX * bulge;
                const controlY = midY + sign * perpY * bulge;

                // Draw quadratic curve
                ctx.beginPath();
                ctx.moveTo(line.p1.x, line.p1.y);
                ctx.quadraticCurveTo(controlX, controlY, line.p2.x, line.p2.y);
                ctx.stroke();
                drawn++;
            }

            console.log('  drawIsolines() finished - drew', drawn, 'curved isoline segments');
        }

        function getElevationColor(normalizedElevation) {
            // normalizedElevation is 1-10
            const colors = [
                { val: 1, color: [0, 0, 128] },      // Deep blue
                { val: 3, color: [30, 144, 255] },   // Blue
                { val: 5, color: [34, 139, 34] },    // Green
                { val: 7, color: [255, 255, 0] },    // Yellow
                { val: 9, color: [139, 69, 19] },    // Brown
                { val: 10, color: [255, 255, 255] }  // White
            ];

            for (let i = 0; i < colors.length - 1; i++) {
                if (normalizedElevation >= colors[i].val && normalizedElevation <= colors[i + 1].val) {
                    const t = (normalizedElevation - colors[i].val) / (colors[i + 1].val - colors[i].val);
                    const r = Math.floor(colors[i].color[0] + (colors[i + 1].color[0] - colors[i].color[0]) * t);
                    const g = Math.floor(colors[i].color[1] + (colors[i + 1].color[1] - colors[i].color[1]) * t);
                    const b = Math.floor(colors[i].color[2] + (colors[i + 1].color[2] - colors[i].color[2]) * t);
                    return `rgb(${r}, ${g}, ${b})`;
                }
            }
            return 'rgb(255, 255, 255)';
        }

        // Check if two line segments intersect and return intersection point
        function lineSegmentIntersection(p1, p2, p3, p4) {
            const x1 = p1.x, y1 = p1.y;
            const x2 = p2.x, y2 = p2.y;
            const x3 = p3.x, y3 = p3.y;
            const x4 = p4.x, y4 = p4.y;

            const denom = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
            if (Math.abs(denom) < 1e-10) return null; // Parallel or coincident

            const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / denom;
            const u = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / denom;

            // Check if intersection is within both segments (excluding endpoints)
            if (t > 0 && t < 1 && u > 0 && u < 1) {
                return {
                    x: x1 + t * (x2 - x1),
                    y: y1 + t * (y2 - y1),
                    tAB: t,  // Parameter along A-B line
                    tEdge: u // Parameter along edge
                };
            }

            return null;
        }

        // Check if two nodes share an edge
        function nodesShareEdge(nodeA, nodeB) {
            for (const edge of edges) {
                if ((edge.p1 === nodeA && edge.p2 === nodeB) ||
                    (edge.p1 === nodeB && edge.p2 === nodeA)) {
                    return true;
                }
            }
            return false;
        }

        // Check if a line from pointA to pointB intersects the ground
        function lineIntersectsGround(pointA, pointB) {
            // If A and B share an edge, they can always see each other
            if (nodesShareEdge(pointA, pointB)) {
                return false;
            }

            // Add 0.1 to elevations (simulating people standing on nodes)
            const elevA = pointA.normalizedElevation + 0.1;
            const elevB = pointB.normalizedElevation + 0.1;

            // Check intersections with all edges in the triangulation
            for (const edge of edges) {
                // Skip edges that share pointA or pointB as an endpoint
                if (edge.p1 === pointA || edge.p1 === pointB ||
                    edge.p2 === pointA || edge.p2 === pointB) {
                    continue;
                }

                const intersection = lineSegmentIntersection(pointA, pointB, edge.p1, edge.p2);

                if (intersection) {
                    // Interpolate elevation along the A-B line at intersection point
                    const lineElev = elevA + intersection.tAB * (elevB - elevA);

                    // Interpolate ground elevation along the edge at intersection point
                    const edgeElev = edge.p1.normalizedElevation +
                                    intersection.tEdge * (edge.p2.normalizedElevation - edge.p1.normalizedElevation);

                    // If line goes below ground, it's blocked
                    if (lineElev < edgeElev) {
                        return true;
                    }
                }
            }

            return false;
        }

        // Calculate visibility from selected node to all other nodes
        function calculateVisibility(selectedNode) {
            const visibilityDistance = medianEdgeLength * 4;
            const visible = [];
            const inRangeNotVisible = [];

            for (const node of points) {
                if (node === selectedNode) continue;

                const dx = node.x - selectedNode.x;
                const dy = node.y - selectedNode.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance <= visibilityDistance) {
                    // Within range, check line of sight
                    if (!lineIntersectsGround(selectedNode, node)) {
                        visible.push(node);
                    } else {
                        inRangeNotVisible.push(node);
                    }
                }
            }

            return { visible, inRangeNotVisible };
        }

        // Draw visibility indicators
        function drawVisibility() {
            if (!selectedNode) return;

            const { visible, inRangeNotVisible } = calculateVisibility(selectedNode);

            // Draw red circles for in-range but not visible
            ctx.strokeStyle = 'rgb(255, 0, 0)';
            ctx.lineWidth = 2;
            for (const node of inRangeNotVisible) {
                ctx.beginPath();
                ctx.arc(node.x, node.y, 8, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Draw green circles for visible
            ctx.strokeStyle = 'rgb(0, 255, 0)';
            ctx.lineWidth = 2;
            for (const node of visible) {
                ctx.beginPath();
                ctx.arc(node.x, node.y, 8, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Draw selection circle around selected node
            ctx.strokeStyle = 'rgb(255, 255, 0)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(selectedNode.x, selectedNode.y, 12, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Calculate directional travel cost between two nodes
        // Going uphill is more costly than going downhill
        // Uses quadratic cost for elevation gain to strongly prefer gradual slopes
        function calculateTravelCost(fromNode, toNode) {
            const dx = toNode.x - fromNode.x;
            const dy = toNode.y - fromNode.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            const elevationChange = toNode.normalizedElevation - fromNode.normalizedElevation;

            // Base cost is the distance
            let cost = distance;

            // Add elevation penalties/bonuses
            if (elevationChange > 0) {
                // Going uphill: quadratic cost scaling
                // This makes steep climbs MUCH more expensive than gradual ones
                // For example: climbing 1 unit = ~2x cost, climbing 2 units = ~8x cost
                const steepnessPenalty = elevationChange * elevationChange * distance * 0.3;
                cost += steepnessPenalty;
            } else {
                // Going downhill: small linear penalty for steep descents
                cost += Math.abs(elevationChange) * distance * 0.1;
            }

            return cost;
        }

        // A* pathfinding algorithm
        function findPath(startNode, endNode) {
            if (!startNode || !endNode || startNode === endNode) {
                return null;
            }

            console.log('Finding path from', startNode, 'to', endNode);

            // Initialize all nodes
            for (const point of points) {
                point.gScore = Infinity;
                point.fScore = Infinity;
                point.cameFrom = null;
                point.inOpenSet = false;
                point.inClosedSet = false;
            }

            // Heuristic function (Euclidean distance)
            function heuristic(node, goal) {
                const dx = goal.x - node.x;
                const dy = goal.y - node.y;
                return Math.sqrt(dx * dx + dy * dy);
            }

            // Priority queue (simple array-based implementation)
            const openSet = [];

            startNode.gScore = 0;
            startNode.fScore = heuristic(startNode, endNode);
            startNode.inOpenSet = true;
            openSet.push(startNode);

            while (openSet.length > 0) {
                // Find node with lowest fScore
                openSet.sort((a, b) => a.fScore - b.fScore);
                const current = openSet.shift();
                current.inOpenSet = false;

                // Goal reached
                if (current === endNode) {
                    // Reconstruct path
                    const path = [];
                    let node = endNode;
                    while (node) {
                        path.unshift(node);
                        node = node.cameFrom;
                    }
                    console.log('Path found with', path.length, 'nodes');
                    return path;
                }

                current.inClosedSet = true;

                // Check all neighbors
                for (const neighborData of current.neighbors) {
                    const neighbor = neighborData.node;

                    if (neighbor.inClosedSet) {
                        continue;
                    }

                    // Calculate tentative gScore
                    const tentativeGScore = current.gScore + calculateTravelCost(current, neighbor);

                    if (tentativeGScore < neighbor.gScore) {
                        // This path is better
                        neighbor.cameFrom = current;
                        neighbor.gScore = tentativeGScore;
                        neighbor.fScore = tentativeGScore + heuristic(neighbor, endNode);

                        if (!neighbor.inOpenSet) {
                            neighbor.inOpenSet = true;
                            openSet.push(neighbor);
                        }
                    }
                }
            }

            // No path found
            console.log('No path found');
            return null;
        }

        // Draw the pathfinding path
        function drawPath() {
            if (!currentPath || currentPath.length < 2) return;

            // Draw path line
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.8)';
            ctx.lineWidth = 4;
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(currentPath[0].x, currentPath[0].y);
            for (let i = 1; i < currentPath.length; i++) {
                ctx.lineTo(currentPath[i].x, currentPath[i].y);
            }
            ctx.stroke();

            // Draw waypoints
            ctx.fillStyle = 'rgba(255, 0, 255, 0.6)';
            for (let i = 1; i < currentPath.length - 1; i++) {
                ctx.beginPath();
                ctx.arc(currentPath[i].x, currentPath[i].y, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw start node (green)
            if (startNode) {
                ctx.fillStyle = 'rgba(0, 255, 0, 1)';
                ctx.strokeStyle = 'rgba(0, 255, 0, 1)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(startNode.x, startNode.y, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            // Draw end node (red)
            if (endNode) {
                ctx.fillStyle = 'rgba(255, 0, 0, 1)';
                ctx.strokeStyle = 'rgba(255, 0, 0, 1)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(endNode.x, endNode.y, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            // Calculate and display path info
            let totalCost = 0;
            let totalDistance = 0;
            let totalElevationGain = 0;
            let totalElevationLoss = 0;

            for (let i = 0; i < currentPath.length - 1; i++) {
                const from = currentPath[i];
                const to = currentPath[i + 1];
                totalCost += calculateTravelCost(from, to);

                const dx = to.x - from.x;
                const dy = to.y - from.y;
                totalDistance += Math.sqrt(dx * dx + dy * dy);

                const elevChange = to.normalizedElevation - from.normalizedElevation;
                if (elevChange > 0) {
                    totalElevationGain += elevChange;
                } else {
                    totalElevationLoss += Math.abs(elevChange);
                }
            }

            // Display path stats
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(width - 250, 10, 240, 100);
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            ctx.fillText(`Path Length: ${currentPath.length} nodes`, width - 240, 30);
            ctx.fillText(`Distance: ${totalDistance.toFixed(1)}`, width - 240, 50);
            ctx.fillText(`Travel Cost: ${totalCost.toFixed(1)}`, width - 240, 70);
            ctx.fillText(`Elevation ↑: ${totalElevationGain.toFixed(1)}`, width - 240, 90);
            ctx.fillText(`Elevation ↓: ${totalElevationLoss.toFixed(1)}`, width - 240, 110);
        }

        // Draw pathfinding selection indicators
        function drawPathfindingSelection() {
            if (!pathfindingMode) return;

            // Draw start node if selected
            if (startNode && !currentPath) {
                ctx.strokeStyle = 'rgba(0, 255, 0, 1)';
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.arc(startNode.x, startNode.y, 15, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        function render() {
            console.log('=== RENDER START ===');
            console.log('showPoints:', showPoints, 'showEdges:', showEdges, 'showIsolines:', showIsolines);
            console.log('Points:', points.length, 'Edges:', edges.length, 'Isolines:', isolines.length);

            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, width, height);

            if (showEdges && edges.length > 0) {
                console.log('Drawing', edges.length, 'edges');

            } else {
                console.log('Skipping edges - showEdges:', showEdges, 'edges.length:', edges.length);
            }

            if (showPoints && points.length > 0) {
                console.log('Drawing', points.length, 'points');
                drawPoints();
            } else {
                console.log('Skipping points - showPoints:', showPoints, 'points.length:', points.length);
            }

            }

        // Generate terrain
        function generate() {
            console.log('=== GENERATE START ===');

            // Clear selection when generating new terrain
            selectedNode = null;
            startNode = null;
            endNode = null;
            currentPath = null;

            const distributionType = document.getElementById('distributionType').value;
            const numPoints = parseInt(document.getElementById('numPoints').value);
            const roughness = parseFloat(document.getElementById('roughness').value);
            const scale = parseFloat(document.getElementById('terrainScale').value);
            const octaves = parseInt(document.getElementById('octaves').value);
            const seed = parseInt(document.getElementById('seed').value);

            console.log('Parameters:', { distributionType, numPoints, roughness, scale, octaves, seed });

            // Generate points
            if (distributionType === 'poisson') {
                points = poissonDiscSampling(width, height, numPoints);
            } else {
                points = hexagonalGrid(width, height, numPoints);
            }
            console.log('Generated', points.length, 'points');

            // Generate terrain
            const generator = new TerrainGenerator(width, height, seed);
            terrain = generator.generate(scale, octaves, roughness);
            console.log('Terrain generated');

            // Assign elevations to points and normalize to 1-10
            let minElev = Infinity;
            let maxElev = -Infinity;

            for (const point of points) {
                point.elevation = getElevation(point.x, point.y);
                minElev = Math.min(minElev, point.elevation);
                maxElev = Math.max(maxElev, point.elevation);
            }

            console.log('Elevation range:', minElev, '-', maxElev);

            // Normalize and round elevations to integers 1-10
            for (const point of points) {
                const normalized = ((point.elevation - minElev) / (maxElev - minElev)) * 9 + 1;
                point.normalizedElevation = Math.round(normalized);
            }

            // Sample normalized elevations
            const sampleElevations = points.slice(0, 5).map(p => p.normalizedElevation);
            console.log('Sample normalized elevations:', sampleElevations);

            // Create Delaunay triangulation
            console.log('Creating Delaunay triangulation...');
            try {
                const delaunay = new Delaunay(points);
                console.log('Delaunay object created');

                // Trim long edges and get median edge length
                medianEdgeLength = delaunay.trimLongEdges();

                edges = delaunay.edges;
                triangles = delaunay.triangles;
                console.log('Created', triangles.length, 'triangles and', edges.length, 'edges');

                if (edges.length === 0) {
                    console.error('ERROR: No edges were created!');
                }
                if (triangles.length === 0) {
                    console.error('ERROR: No triangles were created!');
                }
            } catch (error) {
                console.error('ERROR in Delaunay triangulation:', error);
                edges = [];
                triangles = [];
            }

            // Calculate edge steepness
            console.log('Calculating edge steepness...');
            for (const edge of edges) {
                const dx = edge.p2.x - edge.p1.x;
                const dy = edge.p2.y - edge.p1.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const elevationDiff = Math.abs(edge.p2.normalizedElevation - edge.p1.normalizedElevation);
                edge.steepness = distance > 0 ? elevationDiff / distance : 0;
            }
            console.log('Edge steepness calculated');

            // Build adjacency list for pathfinding
            console.log('Building adjacency list for pathfinding...');
            for (const point of points) {
                point.neighbors = [];
            }
            for (const edge of edges) {
                edge.p1.neighbors.push({ node: edge.p2, edge: edge });
                edge.p2.neighbors.push({ node: edge.p1, edge: edge });
            }
            console.log('Adjacency list built');

            // Generate isolines using triangle-based approach
            console.log('Generating isolines...');
            try {
                isolines = generateIsolines(triangles, points);
                console.log('Generated', isolines.length, 'isoline segments');

                if (isolines.length === 0) {
                    console.warn('WARNING: No isolines were generated!');
                }
            } catch (error) {
                console.error('ERROR in isoline generation:', error);
                isolines = [];
            }

            // Sample some isolines
            if (isolines.length > 0) {
                const sampleIsolines = isolines.slice(0, 3).map(iso => ({
                    level: iso.level,
                    p1: { x: iso.p1.x.toFixed(1), y: iso.p1.y.toFixed(1) },
                    p2: { x: iso.p2.x.toFixed(1), y: iso.p2.y.toFixed(1) }
                }));
                console.log('Sample isolines:', sampleIsolines);
            }

            console.log('=== GENERATE END ===');

            render();
        }

        // Mouse interaction
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            let found = false;

            // Check for point hover
            for (const point of points) {
                const dx = point.x - mouseX;
                const dy = point.y - mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 5) {
                    tooltip.style.display = 'block';
                    tooltip.style.left = e.clientX + 10 + 'px';
                    tooltip.style.top = e.clientY + 10 + 'px';
                    tooltip.innerHTML = `Elevation: ${point.normalizedElevation} (${point.elevation.toFixed(2)})`;
                    found = true;
                    break;
                }
            }

            // Check for edge hover
            if (!found && showPoints) {
                for (const edge of edges) {
                    const dist = distanceToSegment(mouseX, mouseY, edge.p1, edge.p2);
                    if (dist < 5) {
                        tooltip.style.display = 'block';
                        tooltip.style.left = e.clientX + 10 + 'px';
                        tooltip.style.top = e.clientY + 10 + 'px';
                        tooltip.innerHTML = `Steepness: ${edge.steepness.toFixed(4)}`;
                        found = true;
                        break;
                    }
                }
            }

            if (!found) {
                tooltip.style.display = 'none';
            }
        });

        function distanceToSegment(px, py, p1, p2) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const l2 = dx * dx + dy * dy;

            if (l2 === 0) {
                const dpx = px - p1.x;
                const dpy = py - p1.y;
                return Math.sqrt(dpx * dpx + dpy * dpy);
            }

            let t = ((px - p1.x) * dx + (py - p1.y) * dy) / l2;
            t = Math.max(0, Math.min(1, t));

            const projX = p1.x + t * dx;
            const projY = p1.y + t * dy;
            const dpx = px - projX;
            const dpy = py - projY;

            return Math.sqrt(dpx * dpx + dpy * dpy);
        }

        canvas.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
        });

        // Click handler for node selection
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Find clicked node
            let clickedNode = null;
            for (const point of points) {
                const dx = point.x - mouseX;
                const dy = point.y - mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 10) {
                    clickedNode = point;
                    break;
                }
            }

            if (pathfindingMode) {
                // Pathfinding mode: select start and end nodes
                if (!startNode) {
                    startNode = clickedNode;
                    console.log('Start node selected:', startNode);
                } else if (!endNode && clickedNode !== startNode) {
                    endNode = clickedNode;
                    console.log('End node selected:', endNode);
                    // Find path
                    currentPath = findPath(startNode, endNode);
                    if (!currentPath) {
                        alert('No path found between the selected nodes!');
                        startNode = null;
                        endNode = null;
                    }
                } else {
                    // Reset if clicking again
                    startNode = clickedNode;
                    endNode = null;
                    currentPath = null;
                    console.log('Reset - Start node selected:', startNode);
                }
            } else {
                // Visibility mode: toggle selection
                if (clickedNode === selectedNode) {
                    selectedNode = null; // Deselect if clicking the same node
                } else {
                    selectedNode = clickedNode;
                }
            }

            render();
        });

        // UI Controls
        document.getElementById('numPoints').addEventListener('input', (e) => {
            document.getElementById('pointsValue').textContent = e.target.value;
        });

        document.getElementById('roughness').addEventListener('input', (e) => {
            document.getElementById('roughnessValue').textContent = e.target.value;
        });

        document.getElementById('terrainScale').addEventListener('input', (e) => {
            document.getElementById('scaleValue').textContent = e.target.value;
        });

        document.getElementById('octaves').addEventListener('input', (e) => {
            document.getElementById('octavesValue').textContent = e.target.value;
        });

        document.getElementById('generateBtn').addEventListener('click', generate);

        document.getElementById('togglePoints').addEventListener('click', () => {
            showPoints = !showPoints;
            console.log('Toggled showPoints to:', showPoints);
            render();
        });

        document.getElementById('toggleEdges').addEventListener('click', () => {
            showEdges = !showEdges;
            console.log('Toggled showEdges to:', showEdges);
            render();
        });

        document.getElementById('toggleIsolines').addEventListener('click', () => {
            showIsolines = !showIsolines;
            console.log('Toggled showIsolines to:', showIsolines);
            render();
        });

        document.getElementById('togglePathfinding').addEventListener('click', () => {
            pathfindingMode = !pathfindingMode;
            const btn = document.getElementById('togglePathfinding');
            if (pathfindingMode) {
                btn.textContent = 'Disable Pathfinding';
                btn.style.background = '#FF5722';
                // Clear pathfinding state
                startNode = null;
                endNode = null;
                currentPath = null;
            } else {
                btn.textContent = 'Enable Pathfinding';
                btn.style.background = '#FF9800';
                // Clear pathfinding state
                startNode = null;
                endNode = null;
                currentPath = null;
            }
            console.log('Toggled pathfindingMode to:', pathfindingMode);
            render();
        });

        document.getElementById('clearPath').addEventListener('click', () => {
            startNode = null;
            endNode = null;
            currentPath = null;
            console.log('Cleared path');
            render();
        });

        // Initial generation
        generate();
    </script>
</body>
</html>
