<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPEG to SVG Coloring App Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 JPEG to SVG Coloring App Converter</h1>
            <p>Convert images to coloring-friendly SVG files</p>
        </header>

        <div class="upload-section">
            <div class="upload-box" id="uploadBox">
                <input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png" hidden>
                <label for="fileInput" class="upload-label">
                    <div class="upload-icon">📁</div>
                    <p>Click to upload or drag & drop</p>
                    <p class="upload-hint">JPEG, JPG, or PNG files</p>
                </label>
            </div>
        </div>

        <div class="controls-section">
            <h2>Conversion Settings</h2>

            <div class="control-group">
                <label for="minArea">Minimum Area Size (pixels²):</label>
                <input type="range" id="minArea" min="50" max="5000" value="500" step="50">
                <span id="minAreaValue">500</span>
                <p class="control-hint">Smaller regions will be merged with neighbors</p>
            </div>

            <div class="control-group">
                <label for="edgeThreshold">Edge Detection Sensitivity:</label>
                <input type="range" id="edgeThreshold" min="10" max="100" value="50" step="5">
                <span id="edgeThresholdValue">50</span>
                <p class="control-hint">Higher values detect more subtle edges</p>
            </div>

            <div class="control-group">
                <label for="simplification">Path Simplification:</label>
                <input type="range" id="simplification" min="0" max="10" value="2" step="0.5">
                <span id="simplificationValue">2</span>
                <p class="control-hint">Higher values create simpler, smoother paths</p>
            </div>

            <div class="control-group">
                <label>Line Weight Mode:</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="lineWeightMode" value="uniform" checked>
                        <span>Uniform - All lines same weight</span>
                    </label>
                    <label>
                        <input type="radio" name="lineWeightMode" value="dual">
                        <span>Dual - Different weights for boundaries vs. details</span>
                    </label>
                </div>
            </div>

            <div class="control-group" id="uniformWeightGroup">
                <label for="uniformWeight">Line Weight (px):</label>
                <input type="range" id="uniformWeight" min="1" max="10" value="3" step="0.5">
                <span id="uniformWeightValue">3</span>
            </div>

            <div class="control-group hidden" id="dualWeightGroup">
                <label for="boundaryWeight">Boundary Line Weight (px):</label>
                <input type="range" id="boundaryWeight" min="2" max="10" value="4" step="0.5">
                <span id="boundaryWeightValue">4</span>

                <label for="detailWeight">Detail Line Weight (px):</label>
                <input type="range" id="detailWeight" min="0.5" max="5" value="2" step="0.5">
                <span id="detailWeightValue">2</span>
            </div>

            <button id="convertBtn" class="btn btn-primary" disabled>Convert to SVG</button>
        </div>

        <div class="preview-section hidden" id="previewSection">
            <h2>Preview</h2>
            <div class="preview-tabs">
                <button class="tab-btn active" data-tab="original">Original</button>
                <button class="tab-btn" data-tab="processed">Processed</button>
                <button class="tab-btn" data-tab="svg">SVG Result</button>
            </div>
            <div class="preview-container">
                <div class="preview-panel active" id="originalPreview">
                    <canvas id="originalCanvas"></canvas>
                </div>
                <div class="preview-panel" id="processedPreview">
                    <canvas id="processedCanvas"></canvas>
                </div>
                <div class="preview-panel" id="svgPreview">
                    <div id="svgContainer"></div>
                </div>
            </div>
            <div class="preview-actions">
                <button id="downloadBtn" class="btn btn-success">Download SVG</button>
                <div id="statusMessage" class="status-message"></div>
            </div>
        </div>
    </div>

    <script src="imageProcessor.js"></script>
    <script src="svgGenerator.js"></script>
    <script src="app.js"></script>
</body>
</html>
