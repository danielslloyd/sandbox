<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Rewriter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>✍️ Text Rewriter</h1>
            <p>Rewrite text using AI with optional style examples</p>
            <div id="status-indicator" class="status"></div>
        </header>

        <main>
            <div class="form-section">
                <div class="form-group">
                    <label for="model-select">Model:</label>
                    <select id="model-select" class="input-field">
                        <option value="llama3.2">llama3.2</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="corpus-path">
                        Style Corpus Directory (Optional):
                        <span class="help-text">Path to folder with example writing</span>
                    </label>
                    <input
                        type="text"
                        id="corpus-path"
                        class="input-field"
                        placeholder="/path/to/example/writings"
                    >
                </div>

                <div class="form-group">
                    <label for="prompt">
                        Custom Instructions:
                        <span class="help-text">e.g., "rewrite at a second grade reading level"</span>
                    </label>
                    <textarea
                        id="prompt"
                        class="input-field"
                        rows="3"
                        placeholder="Enter your rewriting instructions..."
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="original-text">
                        Text to Rewrite:
                        <span class="help-text">Or upload a file below</span>
                    </label>
                    <textarea
                        id="original-text"
                        class="input-field"
                        rows="8"
                        placeholder="Paste your text here or upload a file..."
                    ></textarea>
                </div>

                <div class="form-group">
                    <label class="file-upload-label">
                        <input
                            type="file"
                            id="file-upload"
                            accept=".txt,.md,.text"
                            style="display: none;"
                        >
                        <span class="button secondary">📁 Upload Text File</span>
                    </label>
                    <span id="file-name" class="file-name"></span>
                </div>

                <div class="button-group">
                    <button id="rewrite-btn" class="button primary">
                        <span class="button-text">Rewrite Text</span>
                        <span class="spinner" style="display: none;"></span>
                    </button>
                    <button id="clear-btn" class="button secondary">Clear All</button>
                </div>
            </div>

            <div id="result-section" class="result-section" style="display: none;">
                <div class="result-header">
                    <h2>Rewritten Text</h2>
                    <button id="copy-btn" class="button small">📋 Copy</button>
                </div>
                <div id="result-text" class="result-text"></div>
                <div id="result-info" class="result-info"></div>
            </div>

            <div id="error-section" class="error-section" style="display: none;">
                <h3>⚠️ Error</h3>
                <p id="error-text"></p>
            </div>
        </main>

        <footer>
            <p>Powered by Ollama • Running locally on your machine</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
