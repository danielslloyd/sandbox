  $('ai-add').addEventListener('click', () => importChild(node));
}

function rerollGene(node, axis){
  const r = rng(newSeed());
  const g = JSON.parse(JSON.stringify(node.genome));
  g.seed = newSeed();
  g.parents = [node.id];
  g.gen = node.gen + 1;
  delete g.id;
  g[axis] = randomGene(axis, r, g);
  repair(g, r);
  const id = spawnChild(g);
  openDetail(id);
}

function aiPrompt(node, note){
  return [
'Here is a seamless animation loop I like. Write me a variation on it.',
'',
'It runs in a tiny Processing-flavoured JavaScript sandbox. The rules are strict:',
'',
'- There is one global clock, `t`, running 0 to 1 over exactly one loop.',
'- `draw_()` is called several times per displayed frame (motion blur) and out of',
'  order when scrubbing, so it must draw purely as a function of `t`. Never',
'  accumulate state between calls.',
'- The frame at t=1 must be pixel-identical to the frame at t=0.',
'- Declare `const W, H, numFrames, samplesPerFrame`, plus `setup()` and `draw_()`.',
'',
'Available: background fill stroke noFill noStroke strokeWeight strokeCap blendMode',
'push pop translate rotate scale rect square circle ellipse arc line point triangle',
'quad bezier beginShape vertex endShape text textSize textAlign colorMode',
'map lerp norm constrain dist sq radians degrees abs min max floor ceil round pow',
'sqrt exp log sin cos tan atan2 random randomSeed randomGaussian noise snoise',
'noiseSeed noiseDetail loopNoise loopSnoise ease(p,g) mod1(x) pingpong(p)',
'Constants: PI TWO_PI HALF_PI QUARTER_PI CENTER CORNER CLOSE ADD BUTT',
'',
'Ways these loops usually close, for reference:',
'- give every element the same 1-periodic animation and a different phase offset;',
'  only the offset mod 1 matters, so any offset field works',
'- the replacement technique: K copies at p = (i + t) / K along an ordered path',
'- rotate a shape by a turn that is an actual symmetry of that shape',
'- integer wave counts: sin(TWO_PI * (n * u - t)) with n a whole number',
'- self-similar zoom: scale(pow(2, t)) over a fractal, one loop per doubling',
'',
'The sketch:',
'',
sourceOf(node),
'',
note ? 'What I want changed: ' + note
     : 'Keep what makes it hypnotic, but add structure the parameters above cannot' +
       ' reach — a new relationship between the elements, not just different numbers.',
'',
'Reply with the complete sketch and nothing else.'
  ].join('\n');
}

function importChild(parent){
  const src = $('ai-paste').value.trim();
  const status = $('ai-status');
  if(!src){ status.textContent = 'nothing pasted'; return; }

  const clean = src.replace(/^```(?:js|javascript)?\s*/i, '').replace(/```\s*$/, '');
  try {
    const f = new Function('API', 'with(API){\n' + clean +
      '\n;return{setup:typeof setup === "function" ? setup : null, draw_: draw_,' +
      'cfg:{W:W, H:H, numFrames:numFrames, samplesPerFrame:samplesPerFrame}};}');
    const api = createAPI();
    const built = f(api);
    if(typeof built.draw_ !== 'function') throw new Error('no draw_() function');
    const cv = document.createElement('canvas');
    cv.width = built.cfg.W; cv.height = built.cfg.H;
    api.__bind(cv.getContext('2d'), built.cfg.W, built.cfg.H);
    if(built.setup) built.setup();
    api.t = 0.3; api.__frameReset(); built.draw_();      // prove it runs
  } catch(e){
    status.textContent = 'rejected: ' + e.message;
    return;
  }

  const id = 'n' + (world.nextId++);
  world.nodes[id] = {
    id: id, genome: null, source: clean, gen: parent.gen + 1,
    parents: [parent.id], custom: true, keep: false, pruned: false
  };
  world.order.push(id);
  world.population.push(id);
  status.textContent = 'added as ' + id;
  $('ai-paste').value = '';
  renderPopulation();
  renderTree();
  persist();
  openDetail(id);
}

function copyText(text, btn){
  const done = ok => {
    const old = btn.textContent;
    btn.textContent = ok ? 'copied' : 'copy failed';
    setTimeout(() => { btn.textContent = old; }, 1200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => done(true), () => done(false));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    ta.remove(); done(ok);
  }
}

/* ---------------- persistence ---------------- */
function persist(){
  try {
    const slim = {};
    world.order.forEach(id => {
      const n = world.nodes[id];
      slim[id] = { id: n.id, genome: n.genome, gen: n.gen, parents: n.parents,
                   custom: n.custom, keep: n.keep, pruned: n.pruned,
                   source: n.custom ? n.source : null };
    });
    localStorage.setItem(LS, JSON.stringify({
      nodes: slim, order: world.order, population: world.population,
      gen: world.gen, nextId: world.nextId, seedCounter: world.seedCounter,
      themes: ACTIVE_THEMES
    }));
  } catch(e){ /* quota or private mode; the tree just won't survive a reload */ }
}

function restore(data){
  world.nodes = {}; world.order = []; compiled.clear();
  Object.keys(data.nodes).forEach(id => {
    const n = data.nodes[id];
    n.source = n.custom ? n.source : genomeToSource(n.genome);
    n.thumb = null;
    world.nodes[id] = n;
  });
  world.order = data.order.filter(id => world.nodes[id]);
  world.population = data.population.filter(id => world.nodes[id]);
  world.gen = data.gen || 0;
  world.nextId = data.nextId || (world.order.length + 1);
  world.seedCounter = data.seedCounter || 1;
  const themes = (data.themes || []).filter(id => THEMES.some(t => t.id === id));
  setThemes(themes);
  renderThemes(themes);
  renderPopulation();
  renderTree();
}

/* ---------------- themes ---------------- */
function renderThemes(active){
  const host = $('themes');
  host.innerHTML = '';
  THEMES.forEach(th => {
    const lab = document.createElement('label');
    lab.className = 'theme' + (active.indexOf(th.id) >= 0 ? ' on' : '');
    lab.title = th.blurb;
    lab.innerHTML = '<input type="checkbox" value="' + th.id + '"' +
      (active.indexOf(th.id) >= 0 ? ' checked' : '') + '>' + escapeHtml(th.label);
    host.appendChild(lab);
  });
  $('theme-n').textContent = active.length;
}

function readThemes(){
  const ids = Array.prototype.slice
    .call($('themes').querySelectorAll('input:checked'))
    .map(i => i.value);
  setThemes(ids);
  $('themes').querySelectorAll('.theme').forEach(l => {
    l.classList.toggle('on', l.querySelector('input').checked);
  });
  $('theme-n').textContent = ids.length;
  persist();
}

$('themes').addEventListener('change', readThemes);
$('btn-themes-clear').addEventListener('click', () => {
  $('themes').querySelectorAll('input').forEach(i => { i.checked = false; });
  readThemes();
});

/* ---------------- wiring ---------------- */
$('pop').addEventListener('click', e => {
  const tile = e.target.closest('.tile');
  if(!tile) return;
  const id = tile.dataset.id;
  const act = e.target.dataset && e.target.dataset.act;

  if(act === 'open'){ openDetail(id); return; }
  if(act === 'kill'){
    world.nodes[id].pruned = true;
    world.population = world.population.filter(x => x !== id);
    renderPopulation(); renderTree(); persist();
    return;
  }
  const node = world.nodes[id];
  node.keep = !node.keep;
  tile.classList.toggle('keep', node.keep);
  updateCounters();
  renderTree();
  persist();
});

$('btn-seed').addEventListener('click', seedPopulation);
$('btn-breed').addEventListener('click', () => breed(null));
$('d-breed').addEventListener('click', () => {
  if(!detailId) return;
  const id = detailId;
  closeDetail();
  world.nodes[id].keep = true;
  breed(id);
});
$('d-keep').addEventListener('click', () => {
  if(!detailId) return;
  const n = world.nodes[detailId];
  n.keep = !n.keep;
  $('d-keep').textContent = n.keep ? '★ Kept' : '☆ Keep';
  const tile = tiles.get(detailId);
  if(tile) tile.el.classList.toggle('keep', n.keep);
  updateCounters(); renderTree(); persist();
});
$('d-close').addEventListener('click', closeDetail);
$('detail').addEventListener('click', e => { if(e.target.id === 'detail') closeDetail(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeDetail(); $('help').classList.remove('open'); }
});

$('rate').addEventListener('input', e => {
  mutRate = +e.target.value / 100;
  $('rate-v').textContent = e.target.value + '%';
});
$('popsize').addEventListener('input', e => {
  popSize = +e.target.value;
  $('popsize-v').textContent = popSize;
});
$('btn-tree').addEventListener('click', () => {
  const hidden = $('tree-wrap').classList.toggle('hidden');
  $('btn-tree').textContent = hidden ? 'Show lineage' : 'Hide lineage';
});
$('btn-reset').addEventListener('click', () => {
  if(!confirm('Clear the whole lineage? This cannot be undone.')) return;
  world.nodes = {}; world.order = []; world.population = [];
  world.gen = 0; world.nextId = 1; world.seedCounter = 1;
  compiled.clear();
  renderPopulation(); renderTree(); persist();
});
$('btn-save').addEventListener('click', () => {
  persist();
  const blob = new Blob([localStorage.getItem(LS) || '{}'], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'loop-lineage-gen' + world.gen + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});
$('btn-load').addEventListener('click', () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json';
  inp.addEventListener('change', () => {
    const file = inp.files[0];
    if(!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      try { restore(JSON.parse(fr.result)); persist(); }
      catch(e){ alert('Could not read that file: ' + e.message); }
    };
    fr.readAsText(file);
  });
  inp.click();
});

/* ---------------- help ---------------- */
$('help-card').innerHTML = [

$('btn-help').addEventListener('click', () => $('help').classList.add('open'));
$('help').addEventListener('click', e => { if(e.target.id === 'help') $('help').classList.remove('open'); });

/* ---------------- boot ---------------- */
let saved = null;
try { saved = JSON.parse(localStorage.getItem(LS) || 'null'); } catch(e){}
if(saved && saved.order && saved.order.length){
  try { restore(saved); }
  catch(e){ setThemes([]); renderThemes([]); seedPopulation(); }
} else {
  setThemes([]);
  renderThemes([]);
  seedPopulation();
}
})();
</script>
