<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToneMatrix Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow-x: auto;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .matrix-section {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 4px;
        }

        .matrix-column {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .matrix-wrapper {
            position: relative;
            padding: 6px;
            background: #0a0a0a;
            border-radius: 4px;
        }

        .matrix {
            display: grid;
            grid-template-columns: repeat(64, 1fr);
            gap: 1px;
            background: #111;
            padding: 1px;
        }

        .cell {
            width: 14px;
            height: 14px;
            background: #1a1a1a;
            border-radius: 1px;
            cursor: pointer;
            transition: all 0.05s ease;
            position: relative;
        }

        .cell:hover {
            background: #2a2a2a;
        }

        /* Instrument 1 - Cyan/Teal */
        .instrument-0 .cell.active {
            background: #00d4aa;
            box-shadow: 0 0 8px #00d4aa, 0 0 15px rgba(0, 212, 170, 0.5);
        }

        .instrument-0 .cell.active.column-highlight {
            background: #00ffcc;
            box-shadow: 0 0 12px #00ffcc, 0 0 20px rgba(0, 255, 204, 0.7);
        }

        /* Instrument 2 - Magenta/Pink */
        .instrument-1 .cell.active {
            background: #d400aa;
            box-shadow: 0 0 8px #d400aa, 0 0 15px rgba(212, 0, 170, 0.5);
        }

        .instrument-1 .cell.active.column-highlight {
            background: #ff00cc;
            box-shadow: 0 0 12px #ff00cc, 0 0 20px rgba(255, 0, 204, 0.7);
        }

        /* Instrument 3 - Orange/Yellow */
        .instrument-2 .cell.active {
            background: #d4aa00;
            box-shadow: 0 0 8px #d4aa00, 0 0 15px rgba(212, 170, 0, 0.5);
        }

        .instrument-2 .cell.active.column-highlight {
            background: #ffcc00;
            box-shadow: 0 0 12px #ffcc00, 0 0 20px rgba(255, 204, 0, 0.7);
        }

        .cell.column-highlight {
            background: #2a2a2a;
        }

        .clone-buttons {
            display: flex;
            flex-direction: column;
            gap: 1px;
            padding-top: 24px; /* Align with grid (label height + wrapper padding) */
        }

        .clone-btn {
            width: 14px;
            height: 14px;
            border: none;
            border-radius: 1px;
            cursor: pointer;
            font-size: 6px;
            font-weight: bold;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clone-btn:hover {
            transform: scale(1.1);
        }

        .clone-spacer {
            width: 14px;
            height: 14px;
        }

        /* Clone button colors per instrument */
        .instrument-0 .clone-btn {
            background: #00d4aa;
            color: #000;
        }

        .instrument-0 .clone-btn:hover {
            background: #00ffcc;
        }

        .instrument-1 .clone-btn {
            background: #d400aa;
            color: #000;
        }

        .instrument-1 .clone-btn:hover {
            background: #ff00cc;
        }

        .instrument-2 .clone-btn {
            background: #d4aa00;
            color: #000;
        }

        .instrument-2 .clone-btn:hover {
            background: #ffcc00;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 10px;
        }

        .btn {
            background: #1a1a1a;
            color: #00d4aa;
            border: 1px solid #00d4aa;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #00d4aa;
            color: #000;
        }

        .btn.active {
            background: #00d4aa;
            color: #000;
        }

        .tempo-control {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #00d4aa;
            font-size: 12px;
        }

        .tempo-control input {
            width: 80px;
            accent-color: #00d4aa;
        }

        .tempo-value {
            min-width: 40px;
            text-align: center;
        }

        .title {
            color: #00d4aa;
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .instrument-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding-left: 7px;
            margin-bottom: 2px;
        }

        .instrument-0 .instrument-label {
            color: #00d4aa;
        }

        .instrument-1 .instrument-label {
            color: #d400aa;
        }

        .instrument-2 .instrument-label {
            color: #d4aa00;
        }

        .instructions {
            color: #444;
            font-size: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">ToneMatrix</h1>

        <div class="controls">
            <button class="btn" id="playBtn">Play</button>
            <button class="btn" id="clearBtn">Clear All</button>
            <div class="tempo-control">
                <label for="tempo">BPM:</label>
                <input type="range" id="tempo" min="60" max="240" value="120">
                <span class="tempo-value" id="tempoValue">120</span>
            </div>
        </div>

        <div class="matrix-section instrument-0" id="section-0">
            <div class="matrix-column">
                <div class="instrument-label">Sine</div>
                <div class="matrix-wrapper">
                    <div class="matrix" id="matrix-0"></div>
                </div>
            </div>
            <div class="clone-buttons" id="clone-buttons-0"></div>
        </div>

        <div class="matrix-section instrument-1" id="section-1">
            <div class="matrix-column">
                <div class="instrument-label">Triangle</div>
                <div class="matrix-wrapper">
                    <div class="matrix" id="matrix-1"></div>
                </div>
            </div>
            <div class="clone-buttons" id="clone-buttons-1"></div>
        </div>

        <div class="matrix-section instrument-2" id="section-2">
            <div class="matrix-column">
                <div class="instrument-label">Sawtooth</div>
                <div class="matrix-wrapper">
                    <div class="matrix" id="matrix-2"></div>
                </div>
            </div>
            <div class="clone-buttons" id="clone-buttons-2"></div>
        </div>

        <p class="instructions">Click cells to create music. Clone buttons copy the first 4/8/16 columns across the grid.</p>
    </div>

    <script>
        // Audio Context
        let audioContext;
        let isPlaying = false;
        let currentColumn = 0;
        let intervalId = null;
        let tempo = 120;

        // Grid dimensions
        const ROWS = 16;
        const COLS = 64;
        const NUM_INSTRUMENTS = 3;

        // Grid states for each instrument
        const grids = Array(NUM_INSTRUMENTS).fill(null).map(() =>
            Array(ROWS).fill(null).map(() => Array(COLS).fill(false))
        );

        // Instrument types
        const instrumentTypes = ['sine', 'triangle', 'sawtooth'];

        // Pentatonic scale frequencies (C major pentatonic, spanning multiple octaves)
        const frequencies = [
            1318.51, // E6
            1174.66, // D6
            1046.50, // C6
            880.00,  // A5
            783.99,  // G5
            659.26,  // E5
            587.33,  // D5
            523.25,  // C5
            440.00,  // A4
            392.00,  // G4
            329.63,  // E4
            293.66,  // D4
            261.63,  // C4
            220.00,  // A3
            196.00,  // G3
            164.81   // E3
        ];

        // Clone button configurations: [sourceColumns, buttonRow]
        const cloneConfigs = [
            { cols: 4, row: 3 },   // 4th row (0-indexed: 3)
            { cols: 8, row: 7 },   // 8th row (0-indexed: 7)
            { cols: 16, row: 15 }  // 16th row (0-indexed: 15)
        ];

        // Initialize all matrices
        function initMatrices() {
            for (let inst = 0; inst < NUM_INSTRUMENTS; inst++) {
                initMatrix(inst);
                initCloneButtons(inst);
            }
        }

        // Initialize a single matrix
        function initMatrix(instrumentIndex) {
            const matrix = document.getElementById(`matrix-${instrumentIndex}`);

            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.instrument = instrumentIndex;
                    cell.dataset.row = row;
                    cell.dataset.col = col;

                    cell.addEventListener('click', () => toggleCell(instrumentIndex, row, col, cell));
                    cell.addEventListener('mouseenter', (e) => {
                        if (e.buttons === 1) {
                            toggleCell(instrumentIndex, row, col, cell);
                        }
                    });

                    matrix.appendChild(cell);
                }
            }
        }

        // Initialize clone buttons for an instrument
        function initCloneButtons(instrumentIndex) {
            const container = document.getElementById(`clone-buttons-${instrumentIndex}`);

            // Create spacer cells and buttons
            for (let row = 0; row < ROWS; row++) {
                const config = cloneConfigs.find(c => c.row === row);

                if (config) {
                    const btn = document.createElement('button');
                    btn.className = 'clone-btn';
                    btn.textContent = config.cols;
                    btn.title = `Clone first ${config.cols} columns`;
                    btn.addEventListener('click', () => clonePattern(instrumentIndex, config.cols));
                    container.appendChild(btn);
                } else {
                    // Spacer
                    const spacer = document.createElement('div');
                    spacer.className = 'clone-spacer';
                    container.appendChild(spacer);
                }
            }
        }

        // Clone pattern across the grid
        function clonePattern(instrumentIndex, sourceCols) {
            const grid = grids[instrumentIndex];

            // Copy the first sourceCols columns across the rest
            for (let row = 0; row < ROWS; row++) {
                for (let col = sourceCols; col < COLS; col++) {
                    const sourceCol = col % sourceCols;
                    grid[row][col] = grid[row][sourceCol];
                }
            }

            // Update UI
            updateGridUI(instrumentIndex);
        }

        // Update grid UI to match state
        function updateGridUI(instrumentIndex) {
            const matrix = document.getElementById(`matrix-${instrumentIndex}`);
            const cells = matrix.querySelectorAll('.cell');

            cells.forEach(cell => {
                const row = parseInt(cell.dataset.row);
                const col = parseInt(cell.dataset.col);

                if (grids[instrumentIndex][row][col]) {
                    cell.classList.add('active');
                } else {
                    cell.classList.remove('active');
                }
            });
        }

        // Toggle cell state
        function toggleCell(instrumentIndex, row, col, cell) {
            grids[instrumentIndex][row][col] = !grids[instrumentIndex][row][col];
            cell.classList.toggle('active');

            // Play sound on activation
            if (grids[instrumentIndex][row][col] && audioContext) {
                playNote(frequencies[row], 0.1, instrumentTypes[instrumentIndex]);
            }
        }

        // Initialize Audio Context
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Play a note
        function playNote(frequency, duration, waveType = 'sine') {
            if (!audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.type = waveType;
            oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);

            // Envelope - different volumes per instrument type
            const now = audioContext.currentTime;
            let volume = 0.15;
            if (waveType === 'triangle') volume = 0.2;
            if (waveType === 'sawtooth') volume = 0.08;

            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(volume, now + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

            oscillator.start(now);
            oscillator.stop(now + duration);
        }

        // Play column for all instruments
        function playColumn(col) {
            // Remove highlight from all cells
            document.querySelectorAll('.cell').forEach(cell => {
                cell.classList.remove('column-highlight');
            });

            // Process each instrument
            for (let inst = 0; inst < NUM_INSTRUMENTS; inst++) {
                const matrix = document.getElementById(`matrix-${inst}`);
                const cells = matrix.querySelectorAll('.cell');

                for (let row = 0; row < ROWS; row++) {
                    const cellIndex = row * COLS + col;
                    const cell = cells[cellIndex];
                    cell.classList.add('column-highlight');

                    if (grids[inst][row][col]) {
                        playNote(frequencies[row], 0.5, instrumentTypes[inst]);
                    }
                }
            }
        }

        // Start/Stop playback
        function togglePlay() {
            const playBtn = document.getElementById('playBtn');

            if (isPlaying) {
                // Stop
                isPlaying = false;
                clearInterval(intervalId);
                playBtn.textContent = 'Play';
                playBtn.classList.remove('active');

                // Remove all highlights
                document.querySelectorAll('.cell').forEach(cell => {
                    cell.classList.remove('column-highlight');
                });
            } else {
                // Start
                initAudio();
                isPlaying = true;
                playBtn.textContent = 'Stop';
                playBtn.classList.add('active');

                const intervalMs = (60 / tempo) * 1000 / 4; // 16th notes

                intervalId = setInterval(() => {
                    playColumn(currentColumn);
                    currentColumn = (currentColumn + 1) % COLS;
                }, intervalMs);
            }
        }

        // Clear all grids
        function clearAllGrids() {
            for (let inst = 0; inst < NUM_INSTRUMENTS; inst++) {
                for (let row = 0; row < ROWS; row++) {
                    for (let col = 0; col < COLS; col++) {
                        grids[inst][row][col] = false;
                    }
                }
                updateGridUI(inst);
            }
        }

        // Update tempo
        function updateTempo(value) {
            tempo = parseInt(value);
            document.getElementById('tempoValue').textContent = value;

            // If playing, restart with new tempo
            if (isPlaying) {
                clearInterval(intervalId);
                const intervalMs = (60 / tempo) * 1000 / 4;
                intervalId = setInterval(() => {
                    playColumn(currentColumn);
                    currentColumn = (currentColumn + 1) % COLS;
                }, intervalMs);
            }
        }

        // Event listeners
        document.getElementById('playBtn').addEventListener('click', togglePlay);
        document.getElementById('clearBtn').addEventListener('click', clearAllGrids);
        document.getElementById('tempo').addEventListener('input', (e) => updateTempo(e.target.value));

        // Initialize on load
        window.addEventListener('load', initMatrices);

        // Handle spacebar for play/pause
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });
    </script>
</body>
</html>
