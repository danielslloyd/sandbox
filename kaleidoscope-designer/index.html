<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaleidoscope Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95em;
        }

        .main-content {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .controls-panel {
            flex: 0 0 300px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            overflow-y: auto;
            max-height: calc(100vh - 200px);
        }

        .canvas-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #mainCanvas {
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: crosshair;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .control-group {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }

        .control-group:last-child {
            border-bottom: none;
        }

        .control-group h3 {
            margin-bottom: 12px;
            color: #667eea;
            font-size: 1.1em;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        select, input[type="number"], input[type="range"], input[type="color"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        input[type="range"] {
            padding: 0;
        }

        .range-value {
            display: inline-block;
            margin-left: 10px;
            font-weight: bold;
            color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .tool-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .tool-button {
            padding: 10px;
            background: white;
            border: 2px solid #ddd;
            color: #333;
        }

        .tool-button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .tool-button:hover {
            border-color: #667eea;
        }

        .info-box {
            background: #e7f3ff;
            padding: 12px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #004085;
            margin-bottom: 15px;
        }

        .color-preview {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 2px solid #ddd;
            border-radius: 4px;
            vertical-align: middle;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ Kaleidoscope Designer ✨</h1>
            <p>Create beautiful symmetrical patterns for coloring</p>
        </div>

        <div class="main-content">
            <div class="controls-panel">
                <div class="control-group">
                    <h3>Symmetry Settings</h3>
                    <label for="symmetryType">Symmetry Type</label>
                    <select id="symmetryType">
                        <option value="rotational">Rotational (Snowflake)</option>
                        <option value="radial">Radial (Mandala)</option>
                    </select>

                    <label for="symmetryOrder">Order of Symmetry: <span id="orderValue" class="range-value">6</span></label>
                    <input type="range" id="symmetryOrder" min="2" max="24" value="6" step="1">
                </div>

                <div class="control-group">
                    <h3>Drawing Tools</h3>
                    <div class="tool-buttons">
                        <button class="tool-button active" data-tool="line">Line</button>
                        <button class="tool-button" data-tool="circle">Circle</button>
                        <button class="tool-button" data-tool="bezier">Bezier</button>
                    </div>

                    <label for="strokeColor">Stroke Color</label>
                    <input type="color" id="strokeColor" value="#000000">

                    <label for="strokeWidth">Stroke Width: <span id="strokeWidthValue" class="range-value">2</span></label>
                    <input type="range" id="strokeWidth" min="0.5" max="5" value="2" step="0.5">
                </div>

                <div class="control-group">
                    <h3>Randomizer</h3>
                    <div class="info-box">
                        Generate random lines that create interesting shapes for coloring
                    </div>

                    <label for="randomLines">Number of Lines: <span id="randomLinesValue" class="range-value">10</span></label>
                    <input type="range" id="randomLines" min="3" max="30" value="10" step="1">

                    <label for="randomJitter">Jitter Amount: <span id="randomJitterValue" class="range-value">0.2</span></label>
                    <input type="range" id="randomJitter" min="0" max="1" value="0.2" step="0.1">

                    <button class="btn-primary" id="randomizeBtn">🎲 Randomize</button>
                </div>

                <div class="control-group">
                    <h3>Export</h3>
                    <label for="exportLineWidth">Export Line Width (px): <span id="exportLineWidthValue" class="range-value">2</span></label>
                    <input type="range" id="exportLineWidth" min="0.5" max="10" value="2" step="0.5">

                    <button class="btn-success" id="exportBtn">📥 Export SVG</button>
                </div>

                <div class="control-group">
                    <h3>Actions</h3>
                    <button class="btn-secondary" id="clearBtn">🗑️ Clear Canvas</button>
                    <button class="btn-secondary" id="undoBtn">↩️ Undo Last</button>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="mainCanvas" width="800" height="800"></canvas>
            </div>
        </div>
    </div>

    <script>
        class KaleidoscopeDesigner {
            constructor() {
                this.canvas = document.getElementById('mainCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.centerX = this.canvas.width / 2;
                this.centerY = this.canvas.height / 2;
                this.radius = Math.min(this.centerX, this.centerY) - 20;

                // Settings
                this.symmetryType = 'rotational';
                this.symmetryOrder = 6;
                this.currentTool = 'line';
                this.strokeColor = '#000000';
                this.strokeWidth = 2;

                // Drawing state
                this.isDrawing = false;
                this.drawingPoints = [];
                this.shapes = [];
                this.currentShape = null;

                this.init();
            }

            init() {
                this.setupEventListeners();
                this.updateRangeValues();
                this.render();
            }

            setupEventListeners() {
                // Canvas events
                this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));

                // Tool selection
                document.querySelectorAll('.tool-button').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.tool-button').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.currentTool = btn.dataset.tool;
                        this.drawingPoints = [];
                    });
                });

                // Controls
                document.getElementById('symmetryType').addEventListener('change', (e) => {
                    this.symmetryType = e.target.value;
                    this.render();
                });

                document.getElementById('symmetryOrder').addEventListener('input', (e) => {
                    this.symmetryOrder = parseInt(e.target.value);
                    document.getElementById('orderValue').textContent = this.symmetryOrder;
                    this.render();
                });

                document.getElementById('strokeColor').addEventListener('input', (e) => {
                    this.strokeColor = e.target.value;
                });

                document.getElementById('strokeWidth').addEventListener('input', (e) => {
                    this.strokeWidth = parseFloat(e.target.value);
                    document.getElementById('strokeWidthValue').textContent = this.strokeWidth;
                });

                // Range value updates
                document.getElementById('randomLines').addEventListener('input', (e) => {
                    document.getElementById('randomLinesValue').textContent = e.target.value;
                });

                document.getElementById('randomJitter').addEventListener('input', (e) => {
                    document.getElementById('randomJitterValue').textContent = e.target.value;
                });

                document.getElementById('exportLineWidth').addEventListener('input', (e) => {
                    document.getElementById('exportLineWidthValue').textContent = e.target.value;
                });

                // Action buttons
                document.getElementById('randomizeBtn').addEventListener('click', () => this.randomize());
                document.getElementById('exportBtn').addEventListener('click', () => this.exportSVG());
                document.getElementById('clearBtn').addEventListener('click', () => this.clear());
                document.getElementById('undoBtn').addEventListener('click', () => this.undo());
            }

            updateRangeValues() {
                document.getElementById('orderValue').textContent = this.symmetryOrder;
                document.getElementById('strokeWidthValue').textContent = this.strokeWidth;
                document.getElementById('randomLinesValue').textContent = document.getElementById('randomLines').value;
                document.getElementById('randomJitterValue').textContent = document.getElementById('randomJitter').value;
                document.getElementById('exportLineWidthValue').textContent = document.getElementById('exportLineWidth').value;
            }

            getMousePos(e) {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            // Convert canvas coordinates to wedge-relative coordinates
            canvasToWedge(x, y) {
                const dx = x - this.centerX;
                const dy = y - this.centerY;
                const angle = Math.atan2(dy, dx);
                const distance = Math.sqrt(dx * dx + dy * dy);

                // Normalize angle to first wedge
                const wedgeAngle = (2 * Math.PI) / this.symmetryOrder;
                let normalizedAngle = ((angle % wedgeAngle) + wedgeAngle) % wedgeAngle;

                return {
                    angle: normalizedAngle,
                    distance: distance,
                    originalAngle: angle
                };
            }

            // Convert wedge coordinates back to canvas
            wedgeToCanvas(angle, distance) {
                return {
                    x: this.centerX + distance * Math.cos(angle),
                    y: this.centerY + distance * Math.sin(angle)
                };
            }

            handleMouseDown(e) {
                const pos = this.getMousePos(e);
                const wedgePos = this.canvasToWedge(pos.x, pos.y);

                // Only allow drawing within the radius
                if (wedgePos.distance > this.radius) return;

                this.isDrawing = true;
                this.drawingPoints = [pos];

                if (this.currentTool === 'line') {
                    this.currentShape = {
                        type: 'line',
                        points: [pos],
                        color: this.strokeColor,
                        width: this.strokeWidth
                    };
                } else if (this.currentTool === 'circle') {
                    this.currentShape = {
                        type: 'circle',
                        center: pos,
                        radius: 0,
                        color: this.strokeColor,
                        width: this.strokeWidth
                    };
                } else if (this.currentTool === 'bezier') {
                    this.currentShape = {
                        type: 'bezier',
                        points: [pos],
                        color: this.strokeColor,
                        width: this.strokeWidth
                    };
                }
            }

            handleMouseMove(e) {
                if (!this.isDrawing) return;

                const pos = this.getMousePos(e);
                const wedgePos = this.canvasToWedge(pos.x, pos.y);

                if (this.currentTool === 'line' && this.currentShape) {
                    this.currentShape.points = [this.currentShape.points[0], pos];
                    this.render();
                    this.drawCurrentShape();
                } else if (this.currentTool === 'circle' && this.currentShape) {
                    const dx = pos.x - this.currentShape.center.x;
                    const dy = pos.y - this.currentShape.center.y;
                    this.currentShape.radius = Math.sqrt(dx * dx + dy * dy);
                    this.render();
                    this.drawCurrentShape();
                } else if (this.currentTool === 'bezier' && this.currentShape) {
                    if (this.currentShape.points.length === 1) {
                        this.currentShape.points.push(pos, pos);
                    } else if (this.currentShape.points.length === 2) {
                        this.currentShape.points.push(pos);
                    } else {
                        this.currentShape.points[this.currentShape.points.length - 1] = pos;
                    }
                    this.render();
                    this.drawCurrentShape();
                }
            }

            handleMouseUp(e) {
                if (!this.isDrawing) return;

                if (this.currentTool === 'bezier' && this.currentShape) {
                    if (this.currentShape.points.length < 3) {
                        // Need at least 3 clicks for bezier
                        return;
                    } else if (this.currentShape.points.length === 3) {
                        // Second click - add control point
                        return;
                    }
                }

                if (this.currentShape) {
                    this.shapes.push(this.currentShape);
                }

                this.isDrawing = false;
                this.currentShape = null;
                this.drawingPoints = [];
                this.render();
            }

            drawCurrentShape() {
                if (!this.currentShape) return;

                this.drawShapeWithSymmetry(this.currentShape);
            }

            drawShapeWithSymmetry(shape) {
                const wedgeAngle = (2 * Math.PI) / this.symmetryOrder;

                for (let i = 0; i < this.symmetryOrder; i++) {
                    const rotationAngle = i * wedgeAngle;

                    this.ctx.save();
                    this.ctx.strokeStyle = shape.color;
                    this.ctx.lineWidth = shape.width;
                    this.ctx.lineCap = 'round';
                    this.ctx.lineJoin = 'round';

                    if (this.symmetryType === 'radial' && i % 2 === 1) {
                        // For radial symmetry, alternate wedges are mirrored
                        this.ctx.translate(this.centerX, this.centerY);
                        this.ctx.rotate(rotationAngle);
                        this.ctx.scale(1, -1);
                        this.ctx.translate(-this.centerX, -this.centerY);
                    } else {
                        // Standard rotation
                        this.ctx.translate(this.centerX, this.centerY);
                        this.ctx.rotate(rotationAngle);
                        this.ctx.translate(-this.centerX, -this.centerY);
                    }

                    this.drawShape(shape);
                    this.ctx.restore();
                }
            }

            drawShape(shape) {
                this.ctx.beginPath();

                if (shape.type === 'line' && shape.points.length === 2) {
                    this.ctx.moveTo(shape.points[0].x, shape.points[0].y);
                    this.ctx.lineTo(shape.points[1].x, shape.points[1].y);
                } else if (shape.type === 'circle') {
                    this.ctx.arc(shape.center.x, shape.center.y, shape.radius, 0, 2 * Math.PI);
                } else if (shape.type === 'bezier' && shape.points.length >= 3) {
                    this.ctx.moveTo(shape.points[0].x, shape.points[0].y);
                    if (shape.points.length === 3) {
                        this.ctx.quadraticCurveTo(
                            shape.points[1].x, shape.points[1].y,
                            shape.points[2].x, shape.points[2].y
                        );
                    } else if (shape.points.length === 4) {
                        this.ctx.bezierCurveTo(
                            shape.points[1].x, shape.points[1].y,
                            shape.points[2].x, shape.points[2].y,
                            shape.points[3].x, shape.points[3].y
                        );
                    }
                }

                this.ctx.stroke();
            }

            render() {
                // Clear canvas
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw background circle
                this.ctx.fillStyle = '#ffffff';
                this.ctx.beginPath();
                this.ctx.arc(this.centerX, this.centerY, this.radius, 0, 2 * Math.PI);
                this.ctx.fill();

                // Draw wedge guides (light)
                this.ctx.strokeStyle = '#e0e0e0';
                this.ctx.lineWidth = 1;
                const wedgeAngle = (2 * Math.PI) / this.symmetryOrder;

                for (let i = 0; i < this.symmetryOrder; i++) {
                    const angle = i * wedgeAngle;
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.centerX, this.centerY);
                    this.ctx.lineTo(
                        this.centerX + this.radius * Math.cos(angle),
                        this.centerY + this.radius * Math.sin(angle)
                    );
                    this.ctx.stroke();
                }

                // Draw outer circle
                this.ctx.strokeStyle = '#ddd';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.arc(this.centerX, this.centerY, this.radius, 0, 2 * Math.PI);
                this.ctx.stroke();

                // Draw all shapes
                this.shapes.forEach(shape => {
                    this.drawShapeWithSymmetry(shape);
                });
            }

            randomize() {
                const numLines = parseInt(document.getElementById('randomLines').value);
                const jitter = parseFloat(document.getElementById('randomJitter').value);

                this.clear();

                // Generate random lines within the first wedge
                const wedgeAngle = (2 * Math.PI) / this.symmetryOrder;
                const lines = [];

                // Create a grid-like pattern with jitter to maximize small shape creation
                const segments = numLines;

                for (let i = 0; i < segments; i++) {
                    // Create lines at different angles and distances
                    const strategy = Math.random();

                    if (strategy < 0.4) {
                        // Radial lines (from center outward)
                        const baseAngle = (i / segments) * wedgeAngle;
                        const angleJitter = (Math.random() - 0.5) * wedgeAngle * jitter;
                        const angle = baseAngle + angleJitter;

                        const startDist = Math.random() * this.radius * 0.3;
                        const endDist = this.radius * (0.7 + Math.random() * 0.3);

                        const start = this.wedgeToCanvas(angle, startDist);
                        const end = this.wedgeToCanvas(angle, endDist);

                        lines.push({
                            type: 'line',
                            points: [start, end],
                            color: this.strokeColor,
                            width: this.strokeWidth
                        });
                    } else if (strategy < 0.7) {
                        // Concentric arcs/circles
                        const dist = (i / segments) * this.radius * (0.8 + Math.random() * 0.2);
                        const distJitter = (Math.random() - 0.5) * this.radius * jitter;
                        const radius = dist + distJitter;

                        lines.push({
                            type: 'circle',
                            center: { x: this.centerX, y: this.centerY },
                            radius: radius,
                            color: this.strokeColor,
                            width: this.strokeWidth
                        });
                    } else {
                        // Diagonal/crossing lines
                        const angle1 = Math.random() * wedgeAngle;
                        const angle2 = Math.random() * wedgeAngle;
                        const dist1 = Math.random() * this.radius;
                        const dist2 = Math.random() * this.radius;

                        const start = this.wedgeToCanvas(angle1, dist1);
                        const end = this.wedgeToCanvas(angle2, dist2);

                        lines.push({
                            type: 'line',
                            points: [start, end],
                            color: this.strokeColor,
                            width: this.strokeWidth
                        });
                    }
                }

                this.shapes = lines;
                this.render();
            }

            clear() {
                this.shapes = [];
                this.render();
            }

            undo() {
                if (this.shapes.length > 0) {
                    this.shapes.pop();
                    this.render();
                }
            }

            exportSVG() {
                const lineWidth = parseFloat(document.getElementById('exportLineWidth').value);
                const size = this.radius * 2;
                const viewBox = `${this.centerX - this.radius} ${this.centerY - this.radius} ${size} ${size}`;

                let svg = `<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n`;
                svg += `<svg width="${size}" height="${size}" viewBox="${viewBox}" xmlns="http://www.w3.org/2000/svg">\n`;
                svg += `  <desc>Created with Kaleidoscope Designer</desc>\n`;
                svg += `  <g id="pattern">\n`;

                const wedgeAngle = (2 * Math.PI) / this.symmetryOrder;

                this.shapes.forEach(shape => {
                    for (let i = 0; i < this.symmetryOrder; i++) {
                        const rotationAngle = (i * wedgeAngle * 180) / Math.PI;
                        const isMirrored = this.symmetryType === 'radial' && i % 2 === 1;

                        let transform = `rotate(${rotationAngle} ${this.centerX} ${this.centerY})`;
                        if (isMirrored) {
                            transform += ` scale(1, -1) translate(0, ${-2 * this.centerY})`;
                        }

                        if (shape.type === 'line' && shape.points.length === 2) {
                            svg += `    <line x1="${shape.points[0].x}" y1="${shape.points[0].y}" `;
                            svg += `x2="${shape.points[1].x}" y2="${shape.points[1].y}" `;
                            svg += `stroke="${shape.color}" stroke-width="${lineWidth}" `;
                            svg += `stroke-linecap="round" fill="none" `;
                            svg += `transform="${transform}" />\n`;
                        } else if (shape.type === 'circle') {
                            svg += `    <circle cx="${shape.center.x}" cy="${shape.center.y}" `;
                            svg += `r="${shape.radius}" `;
                            svg += `stroke="${shape.color}" stroke-width="${lineWidth}" `;
                            svg += `fill="none" />\n`;
                        } else if (shape.type === 'bezier' && shape.points.length >= 3) {
                            let pathData = `M ${shape.points[0].x} ${shape.points[0].y} `;
                            if (shape.points.length === 3) {
                                pathData += `Q ${shape.points[1].x} ${shape.points[1].y}, `;
                                pathData += `${shape.points[2].x} ${shape.points[2].y}`;
                            } else if (shape.points.length === 4) {
                                pathData += `C ${shape.points[1].x} ${shape.points[1].y}, `;
                                pathData += `${shape.points[2].x} ${shape.points[2].y}, `;
                                pathData += `${shape.points[3].x} ${shape.points[3].y}`;
                            }
                            svg += `    <path d="${pathData}" `;
                            svg += `stroke="${shape.color}" stroke-width="${lineWidth}" `;
                            svg += `stroke-linecap="round" fill="none" `;
                            svg += `transform="${transform}" />\n`;
                        }
                    }
                });

                svg += `  </g>\n`;
                svg += `</svg>`;

                // Download the SVG
                const blob = new Blob([svg], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `kaleidoscope-${Date.now()}.svg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        }

        // Initialize the application
        const app = new KaleidoscopeDesigner();
    </script>
</body>
</html>
